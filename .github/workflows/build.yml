name: Discord PS4 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect OpenOrbis
        run: |
          docker run --rm openorbisofficial/toolchain:v0.5.1 bash -c '
            echo "=== TOOLCHAIN LOCATION ==="
            echo "$OO_PS4_TOOLCHAIN"
            echo "=== HELLO WORLD SAMPLE ==="
            find / -path "*/samples/hello_world/Makefile" 2>/dev/null
          '
