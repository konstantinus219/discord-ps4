name: Discord PS4 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test OpenOrbis Toolchain
        run: |
          docker run --rm openorbisofficial/toolchain:v0.5.1 bash -c "echo OPENORBIS_WORKS"
